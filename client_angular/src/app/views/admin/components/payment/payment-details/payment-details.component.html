<div class="d-flex justify-content-between align-items-center mb-4">
  <c-row class="w-100">
    <c-col xs="12">
      <h2><strong><em>Payment Form</em></strong></h2>
    </c-col>

    <form [formGroup]="paymentForm" (ngSubmit)="onSubmit()">
      <c-row>
        <!-- Guest -->
        <c-col md="4" class="mb-3">
          <label cLabel for="guest_id">Guest</label>
          <select cSelect id="guest_id" formControlName="guest_id" (change)="onPersonChange('guest', $event)">
            <option value="">Select Guest</option>
            <option *ngFor="let guest of guests" [value]="guest.id">{{ guest.name }}</option>
          </select>
        </c-col>

        <!-- Customer -->
        <c-col md="4" class="mb-3">
          <label cLabel for="customer_id">Customer:</label>
          <select cSelect id="customer_id" formControlName="customer_id" (change)="onPersonChange('customer', $event)">
            <option value="">Select Customer</option>
            <option *ngFor="let customer of customers" [value]="customer.id">{{ customer.name }}</option>
          </select>
        </c-col>

        <!-- Organizer -->
        <c-col md="4" class="mb-3">
          <label cLabel for="organizer_id">Organizer</label>
          <select cSelect id="organizer_id" formControlName="organizer_id" (change)="onPersonChange('organizer', $event)">
            <option value="">Select Organizer</option>
            <option *ngFor="let organizer of organizers" [value]="organizer.id">{{ organizer.name }}</option>
          </select>
        </c-col>

        <hr>

        <!-- Other inputs like Order, Room Booking, etc. -->
        <!-- Order -->
        <c-col md="4" class="mb-3">
          <label cLabel for="order_id">Order</label>
          <select cSelect id="order_id" formControlName="order_id">
            <option value="">Select Order</option>
            <option *ngFor="let order of orderData" [value]="order.id">{{ order.order_no }}</option>
          </select>
        </c-col>

        <!-- Room Booking -->
        <c-col md="4" class="mb-3">
          <label cLabel for="room_book_id">Room Booking</label>
          <select cSelect id="room_book_id" formControlName="room_book_id">
            <option value="">Select Room Booking</option>
            <option *ngFor="let room of roomsBooks" [value]="room.id">{{ room.booking_no }}</option>
          </select>
        </c-col>
      </c-row>
    </form>
  </c-row>
</div>

<!-- Payment Details Card (Appears after choosing a Guest, Customer, or Organizer) -->
<c-card *ngIf="payment" class="mt-4">
  <c-card-header class="d-flex justify-content-between align-items-center">
    <strong>Payment Details</strong>
    <button class="btn btn-sm btn-primary" (click)="downloadPaymentPdf()">
      Download PDF Report
    </button>
  </c-card-header>

  <c-card-body>
    <div class="row">
      <!-- Payment Number -->
      <div class="col-md-6 mb-3">
        <label class="form-label">Payment No</label>
        <div class="form-control">{{ payment.payment_no }}</div>
      </div>

      <!-- Payment Date -->
      <div class="col-md-6 mb-3">
        <label class="form-label">Payment Date</label>
        <div class="form-control">{{ payment.payment_date | date:'yyyy-MM-dd HH:mm' }}</div>
      </div>

      <!-- Amount -->
      <div class="col-md-6 mb-3">
        <label class="form-label">Amount</label>
        <div class="form-control">{{ payment.amount }}</div>
      </div>
